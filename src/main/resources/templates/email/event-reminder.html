<!doctype html>
<html lang="en">
<body>
<h1>Event reminder</h1>
<p>Your event <strong th:text="${eventName}">Event</strong> starts soon.</p>
<ul>
    <li>Date: <span th:text="${eventDate}">date</span></li>
    <li>Location: <span th:text="${location}">location</span></li>
    <li>Ticket code: <span th:text="${ticketCode}">ticket</span></li>
</ul>
</body>
</html>
