name: CI

on:
  push:
    branches:
      - main
      - duygri
  pull_request:
    branches:
      - main
      - duygri
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: chmod +x mvnw && ./mvnw test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          set -o pipefail
          node --version
          npm --version
          npm config get engine-strict
          npm cache clean --force
          if ! npm ci --no-audit --no-fund --prefer-online 2>&1 | tee npm-ci.log; then
            message="$(tail -n 80 npm-ci.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=npm ci failed::$message"
            exit 1
          fi

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Prepare staging environment
        run: cp .env.example .env

      - name: Build containers
        env:
          DOCKER_BUILDKIT: '1'
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for services
        run: sleep 30

      - name: Run smoke test
        run: |
          set -o pipefail
          annotate_failure() {
            title="$1"
            file="$2"
            if [ -f "$file" ]; then
              message="$(tail -n 120 "$file")"
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              echo "::error title=${title}::${message}"
            fi
          }

          chmod +x scripts/smoke-test.sh
          if ! scripts/smoke-test.sh 2>&1 | tee smoke-test.log; then
            docker compose ps 2>&1 | tee compose-ps.log || true
            docker compose logs --no-color --tail=300 backend > backend-logs.log 2>&1 || true
            docker compose logs --no-color --tail=120 db > db-logs.log 2>&1 || true
            docker compose logs --no-color --tail=80 frontend > frontend-logs.log 2>&1 || true
            annotate_failure "smoke test failed" smoke-test.log
            annotate_failure "docker compose ps" compose-ps.log
            annotate_failure "backend logs" backend-logs.log
            annotate_failure "db logs" db-logs.log
            annotate_failure "frontend logs" frontend-logs.log
            exit 1
          fi

      - name: Stop containers
        if: always()
        run: docker compose down -v
